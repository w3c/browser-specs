version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: '10:00'
  groups:
    development-dependencies:
      dependency-type: "development"
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: daily
    time: '10:00'
  groups:
    actions-dependencies:
      patterns:
        - "*"
